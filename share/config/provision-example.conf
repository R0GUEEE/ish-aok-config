#!/bin/bash
###############################################################################
# systui — Enhanced Provisioning Configuration File (Example)
#
# Usage:
#   provision_alpine_enhanced /path/to/config.conf
#   provision_debian_enhanced /path/to/config.conf
#   provision_arch_enhanced /path/to/config.conf
#   provision_devuan_enhanced /path/to/config.conf
#
# This file contains all available configuration options for the enhanced
# provisioning scripts. Copy this file and edit to suit your needs.
###############################################################################

# ============================================================================
# BASIC SYSTEM CONFIGURATION
# ============================================================================

# Timezone (valid tzdata identifiers, e.g., UTC, America/New_York, Europe/London)
tz="UTC"

# Default username (created as unprivileged user with sudo access)
user="sysadmin"

# System hostname
host="production-node"

# Default shell for users (bash, zsh, fish, ksh)
shell="bash"

# Disable password prompts for sudo (0=require password, 1=no password)
nopass=0

# ============================================================================
# PROVISIONING PROFILE
# ============================================================================
#
# Profile determines which packages to install:
#   minimal   - Bare essentials only (shell, sudo, ssh)
#   standard  - Development tools + common utilities (DEFAULT)
#   full      - Standard + full dev suite (compilers, tools, services)
#   dev       - Full + advanced development tools (LLVM, Rust, Go, etc.)
#   server    - Server-focused: nginx, postgresql, redis, fail2ban, etc.
#   container - Container-focused: docker, podman, kubernetes, etc.
#

profile="standard"

# ============================================================================
# NETWORK CONFIGURATION
# ============================================================================

# Use DHCP (1) or static IP (0)
dhcp=1

# Static IP address (only used if dhcp=0)
# Format: 192.168.1.10/24
ipaddr="192.168.1.100/24"

# Default gateway (only used if dhcp=0)
gateway="192.168.1.1"

# DNS servers (space-separated list)
dns_servers="1.1.1.1 8.8.8.8"

# Keyboard layout (us, de, fr, uk, etc. or 'default' to skip)
keyboard="us"

# ============================================================================
# SSH CONFIGURATION
# ============================================================================

# Enable SSH (1=yes, 0=no)
enable_ssh=1

# SSH port (default: 22)
ssh_port=22

# Allow root login via SSH (0=no, 1=yes)
ssh_root_login=0

# ============================================================================
# FIREWALL & SECURITY
# ============================================================================

# Enable firewall (UFW/iptables) (0=no, 1=yes)
enable_firewall=0

# Enable fail2ban intrusion prevention (0=no, 1=yes)
enable_fail2ban=0

# Enable AppArmor/SELinux security (Debian/Arch only) (0=no, 1=yes)
enable_apparmor=0

# Enable SELinux (Arch only) (0=no, 1=yes)
enable_selinux=0

# ============================================================================
# TIME & NTP
# ============================================================================

# NTP server pool (default: pool.ntp.org)
ntp_server="pool.ntp.org"

# Alternative NTP servers:
#   ntp_server="time.google.com"
#   ntp_server="time.cloudflare.com"
#   ntp_server="ntp.ubuntu.com"

# ============================================================================
# LOGGING & MONITORING
# ============================================================================

# Syslog level (Alpine/Devuan) or Journald level (Debian/Arch)
# Options: debug, info, notice, warning, err, crit, alert, emerg
syslog_level="info"
journald_level="info"

# Remote syslog server (optional, e.g., "192.168.1.50:514" or leave empty)
remote_syslog=""

# ============================================================================
# SYSTEM TUNING
# ============================================================================

# Maximum number of open file descriptors
max_open_files=65536

# Swap size in MB (0 = no swap)
# Recommended: RAM size for memory-constrained systems
swap_size=1024

# ============================================================================
# AUTOMATIC UPDATES & MAINTENANCE
# ============================================================================

# Enable automatic security updates (0=no, 1=yes)
enable_autoupdate=0

# Enable system audit logging (Alpine only) (0=no, 1=yes)
enable_audit=0

# ============================================================================
# PACKAGE MANAGER OPTIONS (Distro-specific)
# ============================================================================

# APT mirror (Debian/Devuan) - leave empty for default
# Examples:
#   apt_mirror="deb.debian.org"
#   apt_mirror="ftp.de.debian.org"
#   apt_mirror="mirror.example.com"
apt_mirror=""

# Pacman mirror (Arch) - leave empty for default
pacman_mirror=""

# ============================================================================
# ADVANCED EXAMPLES
# ============================================================================

# Example 1: Minimal server with fail2ban and static IP
# profile="server"
# enable_fail2ban=1
# dhcp=0
# ipaddr="10.0.0.50/24"
# gateway="10.0.0.1"
# dns_servers="8.8.8.8 8.8.4.4"

# Example 2: Developer workstation with full tools
# profile="dev"
# shell="zsh"
# enable_firewall=1
# swap_size=2048
# max_open_files=262144

# Example 3: Container node
# profile="container"
# enable_autoupdate=1
# enable_firewall=1
# enable_fail2ban=1
# enable_apparmor=1

# Example 4: Secure SSH bastion host
# profile="server"
# ssh_port=2222
# ssh_root_login=0
# enable_firewall=1
# enable_fail2ban=1
# max_open_files=262144

# Example 5: Minimal appliance
# profile="minimal"
# nopass=1
# enable_ssh=1
# ssh_root_login=0

###############################################################################
# END OF CONFIGURATION
###############################################################################
